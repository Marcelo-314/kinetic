spring:
  application:
    name: chronicle
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:h2:mem:chronicle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        readiness:
          include: readinessState, chronicleRuntime

chronicle:
  runtime:
    scheduler:
      enabled: true
    dispatcher:
      fixed-delay-ms: 1000
    max-concurrent-processes: 4
    lease-duration-seconds: 30
    scan-limit: 20
    health:
      stalled-running-threshold-seconds: 120
